function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}
function rng(g){g.seed=(Math.imul(g.seed,1664525)+1013904223)>>>0;return g.seed/4294967296;}
function newGame(origin='walker',seed=Date.now()>>>0){const o=ORIGINS.find(x=>x.id===origin)||ORIGINS[0];const g={version:1,origin:o.id,seed,turn:1,ap:2,maxTurns:18,stats:{...o.stats},phase:'play',event:null,seen:[],highest:0,entries:0,post:[],codex:['定与生','九地'],log:[],last:'',lastChange:{},totalActions:0};g.queue=EVENTS.map(e=>e.id);for(let i=g.queue.length-1;i>1;i--){const j=1+Math.floor(rng(g)*i);[g.queue[i],g.queue[j]]=[g.queue[j],g.queue[i]];}addLog(g,'山门之外',o.line);return g;}
function addLog(g,title,text){g.log.unshift({turn:g.turn,title,text});g.log=g.log.slice(0,60);g.last=text;}
function apply(g,effect){g.lastChange={};for(const [k,v]of Object.entries(effect||{})){const old=g.stats[k];g.stats[k]=clamp(old+v);g.lastChange[k]=g.stats[k]-old;}}
function actionEffect(g,a){const e={...a.effect};if(a.id==='calm'&&g.stats.conduct>=55)e.focus+=3;if((a.id==='calm'||a.id==='study'||a.id==='observe')&&g.stats.fatigue>=65){if(e.focus>0)e.focus=Math.max(1,Math.floor(e.focus/2));if(e.wisdom>0)e.wisdom=Math.max(1,Math.floor(e.wisdom/2));}return e;}
function enterRequirements(g){return [{name:'定学',current:g.stats.focus,need:62,ok:g.stats.focus>=62},{name:'行持',current:g.stats.conduct,need:55,ok:g.stats.conduct>=55},{name:'疲劳',current:g.stats.fatigue,need:42,ok:g.stats.fatigue<=42,less:true},{name:'牵著',current:g.stats.grasp,need:48,ok:g.stats.grasp<=48,less:true}];}
function disabledReason(g,a){if(g.phase!=='play')return '先完成眼前的事件';if(g.ap<(a.cost||1))return `需要${a.cost||1}次行动`;if(a.needWisdom&&g.stats.wisdom<a.needWisdom)return `慧解需达${a.needWisdom}`;if(a.id==='give'&&g.stats.food<8)return '资粮不足8';if(a.id==='enter'&&enterRequirements(g).some(r=>!r.ok))return '尚需准备：查看定境条件';return '';}
function act(g,id){const a=ACTIONS.find(x=>x.id===id);if(!a||disabledReason(g,a))return false;g.ap-=a.cost||1;g.totalActions++;const ef=actionEffect(g,a);apply(g,ef);let messages={work:'你把一天交给了村里的活计。粮袋重了些，心里也带回几段人声。',rest:'你没有添新的功课。清晨醒来，身体比昨日轻了一点。',guard:'你重新检点言行。几件原本会纠缠的事，停在了最初的地方。',give:'粮袋轻了些。走开时，你留意到自己是否还在等一句感谢。',study:'你把听来的话放在自己的经验旁，辨认其中还不明白的部分。',observe:'你观察一个反复出现的念头：它依着什么，又想要什么。',calm:g.stats.fatigue>=65?'你护持所缘，但疲劳削弱了本次修习的效果。':'林间没有比昨日更安静。你只是比昨日更能安住。'};if(id==='study'&&!g.codex.includes('定与慧'))g.codex.push('定与慧');
 if(id==='enter'){g.highest=1;g.entries++;g.phase='meditation';if(!g.codex.includes('五支'))g.codex.push('五支');addLog(g,'初静虑 · 定境演示','寻、伺、喜、轻安乐、等持五支显现。所生之地仍为欲界人趣。');}else addLog(g,a.name,messages[id]);return true;}
function leaveMeditation(g){if(g.phase!=='meditation')return false;g.event='after-jhana';g.phase='event';return true;}

const SAVE_KEY='sanyou-chapter-one-v1',ARCHIVE_KEY='sanyou-endings-v1';
let game=null,origin='walker',screen='landing',undoStack=[],locationChoice='forest',selectedCodex='',soundOn=false,audioContext=null,audioNodes=[],storageOk=true;
function readStorage(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch{return null;}}
let stored=readStorage(SAVE_KEY);if(!validSave(stored))stored=null;
let archive=readStorage(ARCHIVE_KEY);if(!Array.isArray(archive))archive=[];archive=archive.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string').slice(0,20);
function save(){if(!game)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));stored=JSON.parse(JSON.stringify(game));storageOk=true;}catch{storageOk=false;}if(game.phase==='ending'){const e=game.ending||getEnding(game);if(!archive.some(x=>x.id===e.id)){archive.push({id:e.id,title:e.title});try{localStorage.setItem(ARCHIVE_KEY,JSON.stringify(archive));}catch{}}}}

function tone(){if(!soundOn||!audioContext)return;const o=audioContext.createOscillator(),a=audioContext.createGain();o.type='sine';o.frequency.value=game?.phase==='meditation'?523.25:261.63;a.gain.setValueAtTime(.001,audioContext.currentTime);a.gain.exponentialRampToValueAtTime(.045,audioContext.currentTime+.03);a.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.7);o.connect(a);a.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.8);}
async function toggleSound(){soundOn=!soundOn;if(soundOn){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume();for(const freq of[65.41,98]){const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.013;o.connect(g);g.connect(audioContext.destination);o.start();audioNodes.push(o,g);}}catch{soundOn=false;toast('当前浏览器暂不能播放环境音');}}else{for(let i=0;i<audioNodes.length;i+=2)audioNodes[i].stop();audioNodes=[];}$('#soundBtn').textContent=soundOn?'音 · 开':'音 · 关';$('#soundBtn').setAttribute('aria-label',soundOn?'关闭环境音':'开启环境音');}

function landing(){return `<section class="landing fade"><div class="landing-art">${landscape('dawn')}</div><div class="landing-content"><p class="chapter">第一章 · 十八旬的山间行旅</p><h1>三有</h1><h2>初禅之后</h2><p class="lead">你可以追求更安稳的生活，更深的寂静。<br>后来，你还要面对想留住它们的心。</p><p class="origin-label">选择这段行旅的起点</p><div class="origins">${ORIGINS.map(o=>`<button class="origin ${origin===o.id?'selected':''}" data-origin="${o.id}" aria-pressed="${origin===o.id}"><b>${o.name}</b><p>${o.line}</p><small>${o.gift}</small></button>`).join('')}</div><div class="landing-actions"><button class="primary" id="startBtn">${stored?'开启新行旅':'开始行旅'} →</button>${stored?`<button class="secondary" id="continueBtn">${stored.phase==='ending'?'回看上次行旅':'继续第 '+stored.turn+' 旬'} ↗</button>`:''}</div><p class="landing-meta">回合策略 × 分支叙事 · 约 10–15 分钟 · 自动保存 · 无需调用 AI<br>当前原型以《俱舍论》启发规则，数值与角色故事为游戏编制。</p></div></section>`;}

function advice(){if(game.stats.fatigue>=65)return '身体已经疲倦。歇息能让后续修习更有效。';if(game.stats.food<12)return '资粮不多了。入村劳作可以让行旅继续。';if(game.stats.grasp>=55)return '你有些难以放下。听闻与观照提供另一种安排。';if(enterRequirements(game).every(x=>x.ok)&&game.ap===2)return '本旬条件已备，可用两次行动进修初定。';if(game.turn===1)return '先看左侧状态。可守护行持、入村补给，或开始修止。';return '点选地点会标出相应行动；每旬可安排两次。';}
function story(){const e=game.phase==='event'?currentEvent(game):null;return `<div class="story"><div class="story-label"><span class="eyebrow">${e?e.tag:game.phase==='meditation'?'五支显现':game.needsAdvance?'选择之后':'行旅札记'}</span></div><h3>${e?e.title:game.phase==='meditation'?'心的结构发生变化':game.log[0]?.title||'山门之外'}</h3><p>${esc(e?e.text:game.last)}</p></div>`;}
function actionPanel(){if(game.phase==='meditation')return `<aside class="action-panel"><div class="action-heading"><h2>在寂静之中</h2><span class="eyebrow">等至</span></div><p class="meditation-text">你已进入本章的初静虑演示。点击场景中的五支，查看有部释义。</p><p class="big-note">获得之后，<br>心会走向哪里？</p><button class="primary" id="leaveBtn" style="width:100%">出定，看看此后的心 →</button><button class="recent-unlock" data-open-codex="五支">闻思录已收录：初静虑五支 ↗</button><p class="event-note">此界面呈现分类结构，并非真实定境的感官再现。</p></aside>`;
 if(game.phase==='event'){const e=currentEvent(game);return `<aside class="action-panel"><div class="action-heading"><h2>此刻的选择</h2><span class="eyebrow">${e.id==='after-jhana'?'定后':'境遇'}</span></div><p class="action-sub">境遇选择不额外消耗行动。</p><div class="event-choices">${e.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="number">0${i+1} /</span><b>${c.name}</b><p>${c.desc}</p><div class="action-effect">${effects(c.effect)}</div></button>`).join('')}</div><p class="event-note">这是虚构情境中的取舍。数值表示本次玩法效果，不替代对现实行为的判断。</p></aside>`;}
 if(game.needsAdvance)return `<aside class="action-panel"><div class="action-heading"><h2>这件事之后</h2><span class="eyebrow">行旅</span></div><p class="meditation-text">这段境遇已经过去。你可以回看刚才的选择，也可以继续下一旬。</p><button class="primary" id="nextBtn" style="width:100%;margin-top:20px">继续第 ${game.turn+1} 旬 →</button><button class="recent-unlock" id="logBtn">回看此行的经历 ↗</button></aside>`;
 return `<aside class="action-panel"><div class="action-heading"><h2>如何度过此旬</h2><div class="ap"><span>余 ${game.ap} 次</span><i class="${game.ap>=1?'filled':''}"></i><i class="${game.ap>=2?'filled':''}"></i></div></div><p class="action-sub">${advice()}</p><div class="action-grid">${ACTIONS.map(a=>{const reason=disabledReason(game,a),aim=locationChoice==='village'?['work','give'].includes(a.id):locationChoice==='room'?['rest','guard','study'].includes(a.id):['calm','observe','enter'].includes(a.id);if(a.id==='enter')return `<button class="action enter ${aim?'aim':''}" data-action="enter" ${reason?'disabled':''} title="${reason||a.desc}"><div><b>进修初定 ↗</b><span style="font-size:8px;color:#a6b08b">消耗两次行动 · 查看下列条件</span><div class="requirements">${enterRequirements(game).map(r=>`<span class="${r.ok?'met':''}">${r.ok?'✓':'·'} ${r.name}${r.less?'≤':'≥'}${r.need}</span>`).join('')}</div></div><div class="action-effect">${reason||'条件已备，可以进修'}</div></button>`;return `<button class="action ${aim?'aim':''}" data-action="${a.id}" ${reason?'disabled':''} title="${reason||a.desc}"><span class="action-top"><span class="action-icon">${a.icon}</span><span class="action-type">${a.type}</span></span><b>${a.name}</b><div class="action-effect">${effects(actionEffect(game,a))}</div>${reason?`<div class="action-reason">${reason}</div>`:''}</button>`;}).join('')}</div><div class="period-end"><button id="nextBtn" class="${game.ap?'wait':'primary'}" ${game.ap?'disabled':''}>${game.turn===18?'结束本章，回看行旅':'收束此旬 →'}</button><p class="hint">${game.ap?'安排完两次行动后，再进入下一旬。':game.turn===18?'此章到此收束，行旅不会被概括为一个果位。':'时间推进时，资粮消耗 3。'}</p></div></aside>`;}
function gameView(){return `<div class="game-top"><div class="location-bread"><span>第一章</span>欲界人趣 / 山间行旅</div><div class="game-top-right"><span class="save-indicator">${storageOk?'● 已自动保存':'本次进度尚未保存'}</span><button class="undo" id="undoBtn" ${undoStack.length?'':'disabled'}>↶ 回看一步</button></div></div><section class="game-grid">${sidebar()}<div class="center">${sceneCard()}${story()}<div class="journal"><div class="journal-head"><span>最近行迹</span><button id="logBtn">完整札记 ↗</button></div>${game.log.slice(1,4).map(l=>`<div class="journal-line"><small>${l.turn} 旬</small><div><strong>${esc(l.title)}</strong>${esc(l.text.slice(0,30))}…</div></div>`).join('')}</div></div>${actionPanel()}</section>`;}
function endingView(){const e=getEnding(game);return `<section class="ending fade"><div class="ending-hero"><div class="landscape">${landscape(e.id==='taste'?'room':'dawn')}</div><div class="ending-copy"><span class="eyebrow">十八旬之后 · 此章收束</span><h1 style="color:${e.color}">${e.title}</h1><p class="line">${e.line}</p><p class="body">${e.text}</p><div class="ending-tags"><span>最高定境：${game.highest?'初静虑':'未入根本定'}</span><span>定后体验：${game.entries} 次</span><span>闻思录：${game.codex.length} 则</span></div><div class="ending-actions"><button class="primary" id="replayBtn">另一种走法 →</button><button class="secondary" id="exportLogBtn">保存行旅札记 ↓</button><button class="secondary" id="endingUndoBtn">↶ 回看最后一步</button></div></div></div><div class="review"><h3>你走过的几个分岔</h3>${game.log.filter(l=>!ACTIONS.some(a=>a.name===l.title)&&l.title!=='山门之外').slice(0,8).reverse().map(l=>`<div class="review-line"><span>${l.turn} 旬</span><b>${esc(l.title)}</b><p>${esc(l.text)}</p></div>`).join('')}<div class="modal-callout" style="background:#29422f;color:#9fb389;border-color:#6c8b62;margin-top:16px">本章不模拟见道与无漏证得。以上结局来自游戏状态与选择，不代表佛教修证判断。</div></div><p class="ending-collection">已见 ${archive.length} 种行旅收束：${archive.map(e=>esc(e.title)).join(' · ')}</p></section>`;}
function render(){const actual=screen==='landing'?'landing':game?.phase==='ending'?'ending':'game';$('#app').innerHTML=actual==='landing'?landing():actual==='ending'?endingView():gameView();$('#codexCount').textContent=String(game?.codex.length||2).padStart(2,'0');$('#soundBtn').textContent=soundOn?'音 · 开':'音 · 关';}
function modal(title,content,label='三有 · 行旅札记'){$('#modalLabel').textContent=label;$('#modalContent').innerHTML=`<h2 class="modal-title">${title}</h2>${content}`;if(!$('#modal').open)$('#modal').showModal();}
function closeModal(){$('#modal').close();}
function showCodex(key){const keys=key?[key]:(game?.codex||['定与生','九地']);modal(key?CODEX[key]?.title||'闻思录':'闻思录',keys.map(k=>{const c=CODEX[k];return c?`<div class="codex-item"><h3>${c.title}</h3><p>${c.text}</p><a href="https://cbetaonline.dila.edu.tw/zh/T1558_${String(c.vol).padStart(3,'0')}" target="_blank" rel="noopener">《俱舍论》卷${c.vol} · 原典 ↗</a></div>`:'';}).join('')+(!key?`<p class="modal-copy">${game?'此行已收录 '+game.codex.length+' 则。新的经历会开放更多条目。':'开始行旅后，随经历逐步收录。'}</p>`:''));}
const MAP_NAMES=['欲界五趣地','离生喜乐地','定生喜乐地','离喜妙乐地','舍念清净地','空无边处地','识无边处地','无所有处地','非想非非想处地'];
const MAP_COPY=['欲界包含五趣及六欲天。本章角色所生为人趣，始终属于欲界。','初静虑属色界第一地。角色可于人趣入初定；这与命终生初静虑天有别。净、无漏初静虑立寻、伺、喜、轻安乐、等持五支。','第二静虑离寻伺，立内等净、喜、轻安乐、等持四支。本章尚不开放其玩法。','第三静虑离喜，立行舍、正念、正慧、乐受、等持五支。乐支与前二静虑的轻安有别。','第四静虑立行舍清净、念清净、非苦乐受、等持四支。无想有情摄广果处，不在这里另加一地。','四无色之第一。名称从加行中思无边空建立；无色界无空间方所。','四无色之第二。从加行中思无边识立名。此处仍具受、想、行、识。','四无色之第三。仍有想，不是心法全部消失。此根本等至可有味、净、无漏。','三有之顶。想极微细而未灭；依有部根本等至唯有味、净，无无漏。它与灭尽定及涅槃不同。'];
function showMap(){modal('三界，九地，三种观察',`<p class="modal-copy">所生之地：<strong>欲界人趣</strong>　·　最高已演示等至：<strong>${game?.highest?'初静虑':'尚无'}</strong><br>此章可操作到初静虑，其余层级开放阅读。点选一地查看。</p><div class="map-list">${MAP_NAMES.map((n,i)=>`<button class="map-row ${i<2?'current':'unavailable'}" data-map="${i}"><i>0${i+1}</i><b>${n}</b><small>${i===0?'欲界 · 所生':i===1?'色界 · 本章可修':i<5?'色界 · 后续章节':'无色界 · 无方所'}</small></button>`).reverse().join('')}</div><p class="modal-copy"><a href="https://wanglu2016.github.io/jushe-sanjie-jiudi/" target="_blank" rel="noopener">打开完整《三界九地》交互图谱 ↗</a></p>`);}
function help(){modal('怎样度过十八旬',`<div class="modal-copy"><p>每旬有<strong>两次行动</strong>。点右侧行动牌立即执行；用完后点击“收束此旬”。间或出现境遇，选择后继续。时间推进时消耗3资粮。</p><p>先照看生活与身体，再选择自己要走的路线。点场景中的“舍、林、村”会标出相应行动，不会消耗次数。</p></div><table class="help-table"><tr><td>定学路线</td><td>守护行持、林间修止，并适当歇息。四项条件达到后，留出一整旬的两次行动，点击“进修初定”。</td></tr><tr><td>观照路线</td><td>听闻思择提高慧解，慧解20后可观照所缘。此路线不以先获得初定为唯一目标。</td></tr><tr><td>生活路线</td><td>入村补给、济人、照看行持。改善生活条件也会形成不同的章节收束。</td></tr><tr><td>反复尝试</td><td>“回看一步”可撤回最近8步内的行动。菜单可开启新行旅，已见结局会保留。</td></tr></table><div class="modal-callout" style="margin-top:17px">入定的数值门槛仅用于游戏平衡，不是《俱舍论》给出的真实修证条件。行持、定学、慧解、牵著不能对应为可量化的戒定慧或随眠总量。</div>`);}
function notes(){modal('依据与编制',`<div class="modal-copy"><p>理论背景取玄奘译《阿毘达磨俱舍论》所述说一切有部／毗婆沙师义。论中另有经部意见及论主评议，不能将全书每一种主张都等同有部定论。</p><p>第一章落实的关系：定静虑与生静虑有别；初静虑五支中乐支为轻安；净等至与此后味著分开；定的获得与无漏断惑分别观察。</p><p><a href="https://cbetaonline.dila.edu.tw/zh/T1558_008" target="_blank" rel="noopener">卷八 · 分别世品</a>　<a href="https://cbetaonline.dila.edu.tw/zh/T1558_028" target="_blank" rel="noopener">卷二十八 · 分别定品</a>　<a href="https://cbetaonline.dila.edu.tw/zh/T1558_019" target="_blank" rel="noopener">卷十九 · 分别随眠品</a>　<a href="https://cbetaonline.dila.edu.tw/zh/T1558_023" target="_blank" rel="noopener">卷二十三 · 分别贤圣品</a></p><p>人物、故事、资源、效果、回合时长和入定门槛均为玩法创作。善恶业及受生不按资粮或好感度结算。第一章不模拟圣道、退转、业果详则或完整心所相应规则。</p><p>进度与已见结局保存在当前浏览器；交互由本地规则运行，无需AI调用。清除浏览器数据会丢失续玩进度。右上菜单可下载离线版。</p></div>`);}
function journal(){modal('行旅札记',`<div class="modal-copy"><p>${game?'第 '+game.turn+' 旬 · '+ORIGINS.find(o=>o.id===game.origin).name:'行旅尚未开始'}</p></div>${(game?.log||[]).map(l=>`<section class="codex-item"><h3>第 ${l.turn} 旬 · ${esc(l.title)}</h3><p>${esc(l.text)}</p></section>`).join('')}`);}
function menu(){modal('行旅之间',`<div class="menu-actions"><button id="backTitleBtn">回到山门<small>保留当前进度，之后可以继续。</small></button><a id="downloadBtn" href="./sanyou-offline.html" download="三有_初禅之后.html">下载离线游戏 ↓<small>保存为一个HTML文件，用浏览器直接打开。</small></a>${game?'<button id="exportLogBtn">保存行旅札记 ↓<small>下载本次选择、状态与经历。</small></button>':''}<button id="collectionBtn">已经走过的路<small>${archive.length?archive.map(e=>esc(e.title)).join(' · '):'第一段行旅尚未收束。'}</small></button></div>`);}
function downloadBlob(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportLog(){if(!game)return;const lines=['# 三有 · 行旅札记','',`身份：${ORIGINS.find(o=>o.id===game.origin).name}`,`当前：第${game.turn}旬`,`最高定境：${game.highest?'初静虑':'未入根本定'}`,...Object.entries(game.stats).map(([k,v])=>`${STAT_NAMES[k]}：${v}`),'',...(game.phase==='ending'?[`本章收束：${getEnding(game).title}`,'']:[]),...game.log.slice().reverse().flatMap(l=>[`## 第${l.turn}旬 · ${l.title}`,'',l.text,'']),'玩法数值与人物故事为虚构编制，不表示真实修证判断。'];downloadBlob(lines.join('\n'),'三有_行旅札记.txt','text/plain;charset=utf-8');toast('行旅札记已保存');}
function begin(){game=newGame(origin);undoStack=[];screen='game';locationChoice='forest';closeModal();save();render();window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.origin){origin=b.dataset.origin;render();return;}
 if(b.dataset.action){doAction(b.dataset.action);return;}
 if(b.dataset.choice!==undefined){choose(+b.dataset.choice);return;}
 if(b.dataset.location){locationChoice=b.dataset.location;if(game?.phase==='play')render();else toast('先完成眼前的境遇，再安排修习');return;}
 if(b.dataset.stat){modal(STAT_NAMES[b.dataset.stat],`<p class="modal-copy">${statHint(b.dataset.stat)}</p>`);return;}
 if(b.dataset.openCodex){showCodex(b.dataset.openCodex);return;}
 if(b.dataset.factor){const f=b.dataset.factor,txt={寻:'对所缘的粗显寻求。依有部为独立心所。',伺:'对所缘的细密伺察，须与寻分别。',喜:'此处为喜受，不能与乐支归为一个数值。',轻安乐:'依有部，初静虑的乐支为轻安，属行蕴；第三静虑的乐支才是乐受。',等持:'心一境性。依有部，别有等持心所，令心专一所缘。'}[f];modal(f,`<p class="modal-copy">${txt}</p><div class="modal-callout">本章五支用于解释净初静虑的结构，不是全部心所清单。</div>`);return;}
 if(b.dataset.map!==undefined){const i=+b.dataset.map;modal(MAP_NAMES[i],`<p class="modal-copy">${MAP_COPY[i]}</p><button class="secondary" id="mapBtn" style="color:#5b7353;border-color:#9aa883;margin-top:15px">← 回到九地图</button>`);return;}
 if(b.id==='startBtn'){if(stored){modal('开启另一段行旅？',`<p class="modal-copy">新的行旅会替换当前续玩进度，已经收录的结局保留。</p><button class="primary" id="confirmStartBtn">以${ORIGINS.find(o=>o.id===origin).name}开始 →</button>`);}else begin();return;}
 if(b.id==='confirmStartBtn'){begin();return;}
 if(b.id==='continueBtn'){game=JSON.parse(JSON.stringify(stored));screen='game';undoStack=[];render();return;}
 if(b.id==='nextBtn'){next();return;}
 if(b.id==='leaveBtn'){snapshot();leaveMeditation(game);save();render();return;}
 if(b.id==='undoBtn'||b.id==='endingUndoBtn'){if(undoStack.length){game=JSON.parse(undoStack.pop());save();render();toast('已回到上一步');}else toast('本次打开前的步骤没有撤回记录');return;}
 if(b.id==='mapBtn'){showMap();return;}
 if(b.id==='codexBtn'){showCodex();return;}
 if(b.id==='helpBtn'){help();return;}
 if(b.id==='soundBtn'){toggleSound();return;}
 if(b.id==='notesBtn'){notes();return;}
 if(b.id==='menuBtn'){menu();return;}
 if(b.id==='closeModal'){closeModal();return;}
 if(b.id==='logBtn'){journal();return;}
 if(b.id==='backTitleBtn'||b.id==='home'||b.id==='replayBtn'){if(game)save();screen='landing';closeModal();render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(b.id==='downloadBtn'){if(window.location.protocol==='file:'){e.preventDefault();const clone=document.documentElement.cloneNode(true);clone.querySelector('#modal')?.removeAttribute('open');downloadBlob('<!doctype html>\n'+clone.outerHTML,'三有_初禅之后.html','text/html;charset=utf-8');}toast('离线版可用浏览器打开，进度在各浏览器独立保存');return;}
 if(b.id==='exportLogBtn'){exportLog();return;}
 if(b.id==='collectionBtn'){modal('已经走过的路',`<p class="modal-copy">${archive.length?archive.map(e=>esc(e.title)).join(' · '):'第一段行旅尚未收束。'}</p><div class="modal-callout">各结局呈现不同的行旅结果，没有总分排名。</div>`);return;}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
render();
</script></body></html>
